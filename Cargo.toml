[package]
name = "verdict_adapter"
version = "0.1.0"
edition = "2021"
description = "Telegraph comparator module (imw_score_deterministic) for the GRID_POWER_PRICE family"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false
